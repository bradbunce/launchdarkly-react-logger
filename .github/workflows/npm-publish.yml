name: Node.js Package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every currently supported Node line (see engines.node).
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `npm ci` runs the `prepare` script, which builds the package.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  publish-npm:
    needs: build
    # Publish only for v* tags — never for branch pushes or pull requests.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm mints a short-lived, workflow-scoped
    # credential at publish time, so there is no long-lived token to leak or
    # rotate. Provenance is generated automatically — no --provenance needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No dependency cache in a release build.
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      # Staged publishing needs npm >= 11.15.0. Node 24 currently bundles
      # 11.19.0, but 24.17 shipped 11.13.0 — self-heal rather than fail with a
      # confusing "unknown command: stage".
      - name: Ensure npm supports staged publishing
        run: |
          V=$(npm --version); echo "npm $V"
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)' "$V" \
            || npm i -g npm@latest
      # Stage, do not publish: this uploads the tarball to a staging area and
      # waits for a maintainer to approve it with 2FA. `npm stage publish` is
      # always permitted for a trusted publisher, so the "Allow npm publish"
      # box on npmjs.com stays unchecked. Access level comes from
      # publishConfig.access in package.json.
      - run: npm stage publish
