name: TEMP verify npm token
# Temporary, manual-only. Publishes nothing. Delete after.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
      - name: npm whoami (direct - must fail loudly)
        id: whoami
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami
      - name: token shape (no value printed)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          T="$NODE_AUTH_TOKEN"
          S=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "raw length: ${#T}"
          echo "length with whitespace stripped: ${#S}"
          case "$T" in
            npm_*) echo "prefix: npm_ (granular or modern classic)" ;;
            *)     echo "prefix: none (uuid-style classic)" ;;
          esac
      - name: raw registry response
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            -w '\nHTTP %{http_code}\n' https://registry.npmjs.org/-/whoami
      - name: fail if whoami failed
        if: steps.whoami.outcome != 'success'
        run: echo "::error::NPM_TOKEN did not authenticate" && exit 1
